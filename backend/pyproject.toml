[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "DJ"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "clipperstash.settings"
python_files = ["test_*.py"]
testpaths = ["tests", "apps"]
addopts = "-q"
